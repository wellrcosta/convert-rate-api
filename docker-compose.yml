version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  exchange-rate-api:
    build: .
    container_name: exchange-rate-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  redis-data:
